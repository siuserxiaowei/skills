[package]
name = "rust-processor"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Deterministic, security-conscious candidate processor for cross-platform-top50"
license = "MIT"

[lib]
name = "rust_processor"
path = "src/lib.rs"

[[bin]]
name = "rust-processor"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
unicode-normalization = "=0.1.25"
url = "=2.5.7"
