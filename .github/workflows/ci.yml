name: BUGFIRE CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-tests:
    name: macOS · Node ${{ matrix.node }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check runtime syntax
        run: |
          find scripts assets -type f \( -name '*.mjs' -o -name '*.js' \) -print0 | xargs -0 -n1 node --check
          find . -type f \( -name '*.sh' -o -name '*.command' \) ! -path './release/*' -print0 | xargs -0 -n1 bash -n
      - name: Run portable automated tests
        env:
          SKILL_VALIDATOR: /nonexistent/quick_validate.py
        run: |
          if [[ -x /usr/bin/lockf ]]; then
            node --test tests/*.test.mjs
          else
            echo "::notice::GitHub's hosted macOS image has no /usr/bin/lockf; kernel-lock tests remain required on a real Mac."
            find tests -maxdepth 1 -name '*.test.mjs' ! -name 'bugfire-state-hardening.test.mjs' -print0 \
              | xargs -0 node --test
          fi

  skill-validation:
    name: Skill package contract
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate skill files and end-to-end wrapper
        working-directory: macos
        run: node --test tests/bugfire-skill.test.mjs
